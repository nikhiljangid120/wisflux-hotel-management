services:
  - type: web
    name: wisflux-hotel-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: hotel-booking-platform
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
